name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos:
    name: Build unsigned macOS app
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Check Wails environment
        run: wails doctor

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run frontend verification
        working-directory: frontend
        run: npm run verify:frontend:ci-macos

      - name: Run Go tests
        run: go test ./...

      - name: Build unsigned macOS app
        run: wails build -platform darwin/universal

      - name: Create artifact archive
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build/bin/ServerPilot.app artifacts/ServerPilot-macos-universal-unsigned.zip
          hdiutil create -volname ServerPilot -srcfolder build/bin/ServerPilot.app -ov -format UDZO artifacts/ServerPilot-macos-universal-unsigned.dmg
          shasum -a 256 artifacts/ServerPilot-macos-universal-unsigned.zip | tee artifacts/ServerPilot-macos-universal-unsigned.zip.sha256
          shasum -a 256 artifacts/ServerPilot-macos-universal-unsigned.dmg | tee artifacts/ServerPilot-macos-universal-unsigned.dmg.sha256

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerPilot-macos-unsigned
          path: |
            artifacts/ServerPilot-macos-universal-unsigned.zip
            artifacts/ServerPilot-macos-universal-unsigned.dmg
            artifacts/ServerPilot-macos-universal-unsigned.zip.sha256
            artifacts/ServerPilot-macos-universal-unsigned.dmg.sha256
          if-no-files-found: error
